        resources: ["networkchaos"]
    sideEffects: None
  - admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: chaos-operator-webhook
        namespace: chaos-system
        path: /mutate-chaos-engineering-io-v1alpha1-stresschaos
