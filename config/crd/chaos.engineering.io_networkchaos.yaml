    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NetworkChaos is the Schema for the networkchaos API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkChaosSpec defines the desired state of NetworkChaos
            properties:
              action:
                description: Action defines the network chaos action
                enum:
                - delay
                - loss
                - duplicate
                - corrupt
                - partition
                - bandwidth
                type: string
              bandwidth:
                description: |-
                  Bandwidth specifies the bandwidth limitation parameters
                  Only applicable when action is 'bandwidth'
                properties:
                  buffer:
                    description: Buffer defines the maximum size of the bucket (bytes)
                    format: int32
                    type: integer
                  limit:
                    description: Limit defines the buffer size (bytes)
                    format: int32
                    type: integer
                  rate:
                    description: Rate defines the bandwidth rate limit (e.g., "1mbps",
                      "100kbps")
                    type: string
                required:
                - rate
                type: object
              blastRadius:
                description: BlastRadius defines limits for the chaos experiment
                properties:
                  maxPercentage:
                    description: MaxPercentage is the maximum percentage of pods that
                      can be affected (0-100)
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  maxPods:
                    description: MaxPods is the maximum number of pods that can be
                      affected
                    format: int32
                    type: integer
                type: object
              corrupt:
                description: |-
                  Corrupt specifies the packet corruption parameters
                  Only applicable when action is 'corrupt'
                properties:
                  correlation:
                    description: Correlation defines the correlation between successive
                      corrupted packets (0-100)
                    type: string
                  corrupt:
                    description: Corrupt defines the percentage of packets to corrupt
                      (0-100)
                    type: string
                required:
                - corrupt
                type: object
              delay:
                description: |-
                  Delay specifies the delay parameters
                  Only applicable when action is 'delay'
                properties:
                  correlation:
                    description: Correlation defines the correlation between successive
                      delay values (0-100)
                    type: string
                  jitter:
                    description: Jitter defines the variation in latency (e.g., "10ms")
                    type: string
                  latency:
                    description: Latency defines the latency to add (e.g., "100ms",
                      "1s")
                    type: string
                required:
                - latency
                type: object
              direction:
                description: Direction defines the traffic direction to apply chaos
                enum:
                - from
                - to
                - both
                type: string
              duplicate:
                description: |-
                  Duplicate specifies the packet duplication parameters
                  Only applicable when action is 'duplicate'
                properties:
                  correlation:
                    description: Correlation defines the correlation between successive
                      duplicated packets (0-100)
                    type: string
                  duplicate:
                    description: Duplicate defines the percentage of packets to duplicate
                      (0-100)
                    type: string
                required:
                - duplicate
                type: object
              duration:
                description: Duration defines how long the chaos will last
                type: string
              externalTargets:
                description: ExternalTargets defines external hosts/IPs to apply chaos
