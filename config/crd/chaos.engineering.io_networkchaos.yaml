                items:
                  type: string
                type: array
              loss:
                description: |-
                  Loss specifies the packet loss parameters
                  Only applicable when action is 'loss'
                properties:
                  correlation:
                    description: Correlation defines the correlation between successive
                      lost packets (0-100)
                    type: string
                  loss:
                    description: Loss defines the percentage of packets to lose (0-100)
                    type: string
                required:
                - loss
                type: object
              mode:
                description: Mode defines the mode to select target pods
                enum:
                - one
                - all
                - fixed
                - fixed-percent
                - random-max-percent
                type: string
              scheduler:
                description: Scheduler defines when to run the chaos experiment
                properties:
                  cron:
                    description: Cron defines a cron expression for scheduled chaos
                    type: string
                type: object
              selector:
                description: Selector defines how to select target pods
                properties:
                  fieldSelectors:
                    additionalProperties:
                      type: string
                    description: FieldSelectors is a map of {key,value} pairs to match
