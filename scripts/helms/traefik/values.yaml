deployment:
  replicas: 1

api:
  dashboard: false

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
    ingressClass: traefik

gateway:
  enabled: false
gatewayClass:
  enabled: false

service:
  enabled: true
  spec:
    type: NodePort

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    nodePort: 30080
  websecure:
    expose:
      default: false
