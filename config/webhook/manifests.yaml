---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: chaos-operator-mutating-webhook
webhooks:
  - admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: chaos-operator-webhook
        namespace: chaos-system
        path: /mutate-chaos-engineering-io-v1alpha1-podchaos
    failurePolicy: Fail
    name: mpodchaos.kb.io
    rules:
      - apiGroups: ["chaos.engineering.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["podchaos"]
    sideEffects: None
  - admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: chaos-operator-webhook
        namespace: chaos-system
        path: /mutate-chaos-engineering-io-v1alpha1-networkchaos
