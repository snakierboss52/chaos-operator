replicas: 1
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
persistence:
  enabled: false
adminUser: admin
adminPassword: admin
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: monitoring
  datasources:
    enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
      - name: InfluxDB-k6
        type: influxdb
        access: proxy
        url: http://influxdb.monitoring.svc.cluster.local:8086
        database: k6
        isDefault: false
        jsonData:
          httpMode: GET
          timeInterval: 5s
