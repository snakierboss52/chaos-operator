                    type: object
                  labelSelectors:
                    additionalProperties:
                      type: string
                    description: LabelSelectors is a map of {key,value} pairs to match
                      labels
                    type: object
                  namespaces:
                    description: Namespaces is a list of target namespaces
                    items:
                      type: string
                    type: array
                  nodeSelectors:
                    additionalProperties:
                      type: string
                    description: NodeSelectors is a map of {key,value} pairs to match
                      node labels
                    type: object
                  podPhaseSelectors:
                    description: PodPhaseSelectors restricts the phase of pods
                    items:
                      type: string
                    type: array
                  pods:
                    description: Pods is a list of pod names to select
                    items:
                      type: string
                    type: array
                type: object
              target:
                description: |-
                  Target defines the target of the network chaos
                  If not specified, all network traffic is affected
                properties:
                  mode:
                    description: Mode defines the mode to select target pods
                    enum:
                    - one
                    - all
                    - fixed
                    - fixed-percent
                    - random-max-percent
                    type: string
                  selector:
                    description: Selector defines how to select target pods
                    properties:
                      fieldSelectors:
                        additionalProperties:
                          type: string
                        description: FieldSelectors is a map of {key,value} pairs
                          to match fields
                        type: object
                      labelSelectors:
                        additionalProperties:
                          type: string
                        description: LabelSelectors is a map of {key,value} pairs
                          to match labels
                        type: object
                      namespaces:
                        description: Namespaces is a list of target namespaces
                        items:
                          type: string
                        type: array
                      nodeSelectors:
                        additionalProperties:
                          type: string
                        description: NodeSelectors is a map of {key,value} pairs to
                          match node labels
                        type: object
                      podPhaseSelectors:
                        description: PodPhaseSelectors restricts the phase of pods
                        items:
                          type: string
                        type: array
                      pods:
                        description: Pods is a list of pod names to select
                        items:
                          type: string
                        type: array
                    type: object
                  value:
                    description: Value provides a parameter for the mode
                    type: string
                type: object
              value:
                description: Value provides a parameter for the mode
                type: string
            required:
            - action
            - mode
            - selector
            type: object
          status:
            description: NetworkChaosStatus defines the observed state of NetworkChaos
            properties:
              affectedPods:
                description: AffectedPods is the list of pods currently affected by
                  the chaos
                items:
                  type: string
                type: array
              completionTime:
                description: CompletionTime is when the chaos experiment completed
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the chaos experiment
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message provides additional information about the current
                  state
                type: string
              observedGeneration:
                description: ObservedGeneration reflects the generation most recently
                  observed by the controller
                format: int64
                type: integer
              phase:
                description: Phase represents the current phase of the chaos experiment
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                - Stopped
                type: string
              result:
                description: Result contains the detailed experiment result
                properties:
                  blastRadiusLimited:
                    description: BlastRadiusLimited indicates if blast radius controls
                      reduced the target set
                    type: boolean
                  failedTargets:
                    description: FailedTargets is how many pods failed to be affected
                    type: integer
                  successfulTargets:
                    description: SuccessfulTargets is how many pods were successfully
                      affected
                    type: integer
                  targetResults:
                    description: TargetResults contains per-pod results
                    items:
                      description: TargetResult captures the result for a single target
                        pod
                      properties:
                        appliedAt:
                          description: AppliedAt is when the chaos was applied to
                            this pod
                          format: date-time
                          type: string
                        error:
                          description: Error contains the error message if the chaos
                            failed
                          type: string
                        name:
                          description: Name is the pod name (namespace/name)
                          type: string
                        success:
                          description: Success indicates if the chaos was applied
                            successfully
                          type: boolean
                      required:
                      - appliedAt
                      - name
                      - success
                      type: object
                    type: array
                  totalTargets:
                    description: TotalTargets is how many pods were targeted
                    type: integer
                required:
                - failedTargets
                - successfulTargets
                - totalTargets
                type: object
              startTime:
                description: StartTime is when the chaos experiment started
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
