apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace donde se desplegará el operador
namespace: chaos-system

resources:
  - ../manager/namespace.yaml
  - ../rbac/service_account.yaml
  - ../rbac/role.yaml
  - ../rbac/role_binding.yaml
  - ../manager/deployment.yaml
  - ../manager/service.yaml

# Imágenes a usar
images:
  - name: goland-operator
    newName: goland-operator
    newTag: latest

# Labels comunes
commonLabels:
  app: chaos-operator
  app.kubernetes.io/name: chaos-operator
  app.kubernetes.io/component: controller
  app.kubernetes.io/part-of: chaos-engineering
