apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-target
  namespace: chaos-demo
  labels:
    app: apache-target
    environment: chaos-testing
    tier: web
spec:
  replicas: 4
  selector:
    matchLabels:
      app: apache-target
  template:
    metadata:
      labels:
        app: apache-target
        environment: chaos-testing
        tier: web
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: apache-target
                topologyKey: kubernetes.io/hostname
      containers:
        - name: apache
          image: apache-nettools:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: apache-target
  namespace: chaos-demo
  labels:
    app: apache-target
spec:
  type: ClusterIP
  selector:
    app: apache-target
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
